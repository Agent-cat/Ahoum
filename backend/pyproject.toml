[project]
name = "backend"
version = "0.1.0"
description = "Sessions Marketplace API (Django + DRF)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "requests>=2.32",
    "gunicorn>=23",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
